services:

  db:
    image: mysql:8.0
    container_name: pizzeria_mysql
    restart: always
    command: --bind-address=0.0.0.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pizzeria_db
    ports:
      - "3306:3306"

  app:
    build: .
    container_name: pizzeria_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:root@db:3306/pizzeria_db

